<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="styleindex.css">

</head>

<body>
    <audio id="ost233" src="audio/ブルーアーカイブ Blue Archive OST 233.mp3" autoplay>
        Your browser does not support the audio element.
    </audio>

    <audio id="ost216" src="audio/ブルーアーカイブ Blue Archive OST 216.mp3">
        Your browser does not support the audio element.
    </audio>
    <main>
        <h1 id="myH1">Welcome</h1>
        <h2>Current background song: <span id="songTitle">None</span></h2>
        <div>
            <label>Username: </label>
            <input id="myText">
            <button id="myButton">Submit</button>
        </div>

        <br>
        <div>
            <fieldset>
                <legend>Are you retarded?</legend>
                <input type="radio" id="retardationYes" name="retardation" value="retarded" checked>
                <label for="retardation">Yes</label>
                <input type="radio" id="retardationNo" name="retardation" value="not retarded">
                <label for="retardation">No</label>
            </fieldset>
        </div>
    </main>

    <div class="button-group">
        <button onclick="enableLoop()" type="button">Enable Loop</button>
        <button onclick="disableLoop()" type="button">Disable Loop</button>
        <button onclick="checkLoopStatus()" type="button">Check Loop Status</button>
    </div>
    
    <div class="button-group">
        <button onclick="goPlay()" type="button">Play</button>
        <button onclick="goPause()" type="button">Pause</button>
        <button onclick="goSwitch()" type="button">Switch</button>
    </div>


    
    <h1>Result</h1>
    <h4>Your name is: <p id="inside_result"></p></h4>
    <h4>Current song: <span id="song_name"></span></h4>

    <script src="myScript.js"></script>
</body>

</html>
